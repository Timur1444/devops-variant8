name: Student Manager CI CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Code quality
        run: python -m ruff check .
      - name: Automated tests
        run: python -m pytest -q --junitxml=reports/junit.xml
      - name: Build artifact
        run: python scripts/build_artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: student-manager-dist
          path: dist/
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
  deploy-test:
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: student-manager-dist
          path: dist/
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Deploy artifact to temporary test environment
        run: python scripts/smoke_deploy.py
      - name: Save smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: reports/
