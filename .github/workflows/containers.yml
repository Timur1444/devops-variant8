name: Docker Compose PostgreSQL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Run containers and verify PostgreSQL
        run: |
          mkdir -p reports
          cp .env.example .env
          docker --version | tee reports/docker-version.txt
          docker compose version | tee reports/compose-version.txt
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:5000/health | tee reports/health.json
          python3 -c "import json; h=json.load(open('reports/health.json')); assert h['status']=='ok' and h['database']=='postgresql'; print('PostgreSQL connection: PASSED')"
          curl -fsS -X POST http://127.0.0.1:5000/api/students -H 'Content-Type: application/json' -d '{"full_name":"Aydana Ermekova","group_name":"IS-22","email":"aydana@example.test"}' | tee reports/created-1.json
          curl -fsS -X POST http://127.0.0.1:5000/api/students -H 'Content-Type: application/json' -d '{"full_name":"Daniyar Omarov","group_name":"IS-22","email":"daniyar@example.test"}' | tee reports/created-2.json
          curl -fsS http://127.0.0.1:5000/api/students | tee reports/students-before.json
          docker compose exec -T db psql -U student_user -d students -c 'SELECT id, full_name, group_name, email FROM students ORDER BY id;' | tee reports/database-rows.txt
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:5000/api/students | tee reports/students-after.json
          python3 -c "import json; a=json.load(open('reports/students-before.json')); b=json.load(open('reports/students-after.json')); assert a==b and len(b)==2; h=json.load(open('reports/health.json')); json.dump(dict(database=h['database'], student_count=len(b), persistence='passed'),open('reports/checks.json','w'),indent=2); print('Persistence after container recreation: PASSED')"
      - name: Capture application screenshot
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,900 --virtual-time-budget=5000 --screenshot="$GITHUB_WORKSPACE/reports/app-postgresql.png" http://127.0.0.1:5000
          test -s reports/app-postgresql.png
      - name: Collect container state and logs
        if: always()
        run: |
          mkdir -p reports
          docker compose ps -a | tee reports/containers.txt
          docker compose logs --no-color --tail=100 > reports/container-logs.txt
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' | tee reports/resources.txt
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-evidence
          path: reports/
          if-no-files-found: error
      - name: Stop containers
        if: always()
        run: docker compose down
